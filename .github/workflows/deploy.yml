name: Deploy

# 실행되는 경우는 두 가지뿐이다.
#   1) Actions 탭에서 직접 실행(workflow_dispatch)
#   2) main의 CI가 성공했고 저장소 변수 DEPLOY_ENABLED가 'true'일 때(workflow_run)
# 변수를 만들지 않았다면 2)는 건너뛰므로 자동 배포는 일어나지 않는다.
#
# 버전은 릴리스 태그로 매긴다. v1.2.3 꼴의 태그를 골라 직접 실행하면 이미지에 그 태그가 붙고 서버도 그 태그로 실행한다.
#   gh workflow run Deploy --ref v1.2.3
# 태그가 아닌 커밋이나 브랜치를 고르면 커밋 SHA가 이미지 태그가 된다.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 배포할 커밋의 전체 SHA, 브랜치 또는 태그. 비우면 위에서 고른 브랜치의 최신 커밋
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# 배포는 한 번에 하나만. 진행 중인 배포는 끊지 않고 다음 것이 기다린다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/heyoonyoon/modelll
  APP_DIR: /opt/chen-erd
  # 서버에는 SSH가 아니라 AWS Systems Manager(Session Manager)로 명령을 보낸다. 22번 포트는 닫혀 있다.
  AWS_REGION: ap-northeast-2
  EC2_INSTANCE_ID: i-0174bd666d2204aaa
  AWS_DEPLOY_ROLE: arn:aws:iam::265213224636:role/modelll-github-deploy

jobs:
  image:
    name: 이미지 빌드와 푸시
    # workflow_run은 포크의 main 브랜치에서 온 PR에도 걸릴 수 있으므로 이 저장소 main의 push로 돈 CI인지까지 확인한다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        vars.DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      # CI가 끝나서 실행된 경우에는 CI가 검증한 바로 그 커밋을 배포한다.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}

      # 릴리스 태그(v1.2.3 꼴)로 실행했으면 그 태그가 버전이고, 아니면 커밋 SHA가 버전이다.
      - name: 배포할 커밋과 버전 확인
        id: commit
        env:
          REQUESTED: ${{ inputs.ref || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          sha="$(git rev-parse HEAD)"
          version="$sha"
          if [[ "$REQUESTED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$REQUESTED"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:latest"
            echo "${IMAGE_NAME}:${sha}"
            if [ "$version" != "$sha" ]; then echo "${IMAGE_NAME}:${version}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 기본은 linux/amd64(t3 계열). Graviton(t4g 계열)이면 저장소 변수 IMAGE_PLATFORMS를 linux/arm64로 둔다.
      - uses: docker/setup-qemu-action@v4
        if: vars.IMAGE_PLATFORMS != '' && vars.IMAGE_PLATFORMS != 'linux/amd64'

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드와 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          tags: ${{ steps.commit.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.version=${{ steps.commit.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: EC2 배포
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # GitHub이 발급하는 짧은 토큰으로 AWS 역할을 잠깐 빌린다(저장된 AWS 키나 SSH 키가 없다)
      id-token: write
    env:
      SHA: ${{ needs.image.outputs.sha }}
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.image.outputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # 설정 파일을 묶어 명령에 담아 보내고, 서버에서 풀어 놓은 뒤 이미지를 교체하고 헬스 체크까지 한다.
      # 명령은 root로 돌지만 파일과 docker는 원래 주인(ec2-user)으로 다룬다. 이미지는 공개 패키지라 로그인하지 않는다.
      - name: 배포 명령 보내기
        id: send
        run: |
          [[ "$VERSION" =~ ^[0-9a-zA-Z.]+$ ]] || { echo "::error::버전 값이 이상합니다: $VERSION"; exit 1; }
          bundle="$(tar czf - docker-compose.yml .env.example deploy/Caddyfile deploy/remote-deploy.sh deploy/backup.sh | base64 -w0)"
          script=$(cat <<EOF
          set -euo pipefail
          tmp=\$(mktemp -d)
          echo '${bundle}' | base64 -d | tar xzf - -C "\$tmp"
          install -d -o ec2-user -g ec2-user '${APP_DIR}' '${APP_DIR}/deploy' '${APP_DIR}/backups'
          install -o ec2-user -g ec2-user -m 644 "\$tmp/docker-compose.yml" "\$tmp/.env.example" '${APP_DIR}/'
          install -o ec2-user -g ec2-user -m 644 "\$tmp/deploy/Caddyfile" '${APP_DIR}/deploy/'
          install -o ec2-user -g ec2-user -m 755 "\$tmp/deploy/remote-deploy.sh" "\$tmp/deploy/backup.sh" '${APP_DIR}/deploy/'
          rm -rf "\$tmp"
          runuser -u ec2-user -- env APP_DIR='${APP_DIR}' '${APP_DIR}/deploy/remote-deploy.sh' up '${VERSION}'
          runuser -u ec2-user -- env APP_DIR='${APP_DIR}' '${APP_DIR}/deploy/remote-deploy.sh' health 60
          EOF
          )
          params="$(jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["600"]}')"
          id="$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "modelll deploy ${VERSION}" --parameters "$params" --query Command.CommandId --output text)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: 배포 결과 기다리기
        env:
          COMMAND_ID: ${{ steps.send.outputs.id }}
        run: |
          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          if [ "$status" != "Success" ]; then
            echo "::error::서버에서 배포가 끝나지 않았습니다(상태: $status)."
            exit 1
          fi

      - name: 배포 결과 기록
        run: echo "배포한 이미지는 \`${IMAGE_NAME}:${VERSION}\` 이고 커밋은 \`${SHA}\` 입니다." >> "$GITHUB_STEP_SUMMARY"
